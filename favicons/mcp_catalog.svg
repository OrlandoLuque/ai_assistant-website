  <!-- Connection waves -->
  <path d="M11 8 C13 6 15 9 16 7" fill="none" stroke="#7c6cf0" stroke-width="0.8" opacity="0.7" stroke-linecap="round"/>
  <path d="M16 7 C17 9 19 6 21 8" fill="none" stroke="#7c6cf0" stroke-width="0.8" opacity="0.7" stroke-linecap="round"/>
