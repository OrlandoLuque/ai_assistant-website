  <circle cx="27" cy="5" r="1.5" fill="#00d4aa" opacity="0.8"/>
  <circle cx="22" cy="5" r="1" fill="#00d4aa" opacity="0.6"/>
  <line x1="23" y1="5" x2="25.5" y2="5" stroke="#00d4aa" stroke-width="0.6" opacity="0.5"/>
  <!-- Plug/connector (MCP Catalog) -->
  <!-- Plug body -->
  <rect x="11" y="10" width="10" height="8" rx="2" fill="none" stroke="#00d4aa" stroke-width="1.5"/>
  <!-- Prongs -->
  <line x1="14" y1="18" x2="14" y2="23" stroke="#00d4aa" stroke-width="2" stroke-linecap="round"/>
