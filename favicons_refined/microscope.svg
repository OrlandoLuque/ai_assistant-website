<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <circle cx="5" cy="27" r="1.5" fill="#6366f1" opacity="0.8"/>
  <circle cx="10" cy="27" r="1" fill="#6366f1" opacity="0.6"/>
  <line x1="6.5" y1="27" x2="9" y2="27" stroke="#6366f1" stroke-width="0.6" opacity="0.5"/>
  <circle cx="27" cy="5" r="1.5" fill="#6366f1" opacity="0.8"/>
  <circle cx="22" cy="5" r="1" fill="#6366f1" opacity="0.6"/>
  <line x1="23" y1="5" x2="25.5" y2="5" stroke="#6366f1" stroke-width="0.6" opacity="0.5"/>
  <!-- Microscope -->
  <!-- Base -->
  <line x1="9" y1="22.5" x2="21" y2="22.5" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Column (right side) -->
  <line x1="19.5" y1="22.5" x2="19.5" y2="8" stroke="#6366f1" stroke-width="1.3"/>
  <!-- Arm (top, going left) -->
  <line x1="19.5" y1="8" x2="14" y2="8" stroke="#6366f1" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Body tube (thick, hanging from arm) -->
  <line x1="14" y1="8" x2="14" y2="16.5" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyepiece (angled up from tube top) -->
  <line x1="12.5" y1="7" x2="14" y2="8" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <!-- Objective lens (bottom of tube) -->
  <rect x="13" y="16.5" width="2.5" height="1.3" rx="0.5" fill="#a78bfa" opacity="0.4"/>
  <!-- Stage -->
  <line x1="9" y1="19" x2="21" y2="19" stroke="#6366f1" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Focus knob (on column) -->
  <circle cx="21" cy="13.5" r="1.3" fill="none" stroke="#6366f1" stroke-width="0.8"/>
</svg>
