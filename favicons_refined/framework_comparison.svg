<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <circle cx="5" cy="27" r="1.5" fill="#6366f1" opacity="0.8"/>
  <circle cx="10" cy="27" r="1" fill="#6366f1" opacity="0.6"/>
  <line x1="6.5" y1="27" x2="9" y2="27" stroke="#6366f1" stroke-width="0.6" opacity="0.5"/>
  <circle cx="27" cy="5" r="1.5" fill="#6366f1" opacity="0.8"/>
  <circle cx="22" cy="5" r="1" fill="#6366f1" opacity="0.6"/>
  <line x1="23" y1="5" x2="25.5" y2="5" stroke="#6366f1" stroke-width="0.6" opacity="0.5"/>
  <!-- Framework Comparison — balance -->
  <!-- Pillar -->
  <line x1="16" y1="9.5" x2="16" y2="23" stroke="#6366f1" stroke-width="1.3"/>
  <!-- Base -->
  <line x1="12" y1="23" x2="20" y2="23" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Fulcrum -->
  <polygon points="14.5,9.5 17.5,9.5 16,7" fill="#6366f1" opacity="0.3" stroke="#6366f1" stroke-width="1" stroke-linejoin="round"/>
  <!-- Beam -->
  <line x1="7" y1="12" x2="25" y2="12" stroke="#6366f1" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Left chains -->
  <line x1="8" y1="12" x2="7.5" y2="14" stroke="#6366f1" stroke-width="0.8"/>
  <line x1="13" y1="12" x2="13.5" y2="14" stroke="#6366f1" stroke-width="0.8"/>
  <!-- Left pan (curved bowl) -->
  <path d="M7.5 14 Q10.5 19 13.5 14" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="1.2"/>
  <!-- Right chains -->
  <line x1="19" y1="12" x2="18.5" y2="14" stroke="#6366f1" stroke-width="0.8"/>
  <line x1="24" y1="12" x2="24.5" y2="14" stroke="#6366f1" stroke-width="0.8"/>
  <!-- Right pan (curved bowl) -->
  <path d="M18.5 14 Q21.5 19 24.5 14" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="1.2"/>
</svg>
