<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <circle cx="5" cy="27" r="1.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="10" cy="27" r="1" fill="#f59e0b" opacity="0.6"/>
  <line x1="6.5" y1="27" x2="9" y2="27" stroke="#f59e0b" stroke-width="0.6" opacity="0.5"/>
  <circle cx="27" cy="5" r="1.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="22" cy="5" r="1" fill="#f59e0b" opacity="0.6"/>
  <line x1="23" y1="5" x2="25.5" y2="5" stroke="#f59e0b" stroke-width="0.6" opacity="0.5"/>
  <!-- Clock (cron scheduler) -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#f59e0b" stroke-width="1.3"/>
  <!-- Clock hands -->
  <line x1="16" y1="16" x2="16" y2="11" stroke="#f59e0b" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="20" y2="16" stroke="#f59e0b" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="1" fill="#f59e0b"/>
  <!-- Repeat arrow (cron loop) -->
  <path d="M23 10 A8 8 0 0 1 24 16" fill="none" stroke="#22c55e" stroke-width="1" stroke-linecap="round"/>
  <polyline points="24,13 24,16 27,16" fill="none" stroke="#22c55e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
