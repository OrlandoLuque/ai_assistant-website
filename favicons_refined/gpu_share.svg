  <rect x="12" y="12" width="8" height="8" rx="1" fill="#38bdf8" opacity="0.3"/>
  <text x="13" y="18.5" font-family="monospace" font-size="5" font-weight="bold" fill="#38bdf8">GPU</text>
  <!-- Pins (top) -->
  <line x1="12" y1="7" x2="12" y2="9" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="7" x2="16" y2="9" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="7" x2="20" y2="9" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <!-- Pins (bottom) -->
  <line x1="12" y1="23" x2="12" y2="25" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="16" y2="25" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="23" x2="20" y2="25" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <!-- Pins (left) -->
  <line x1="7" y1="12" x2="9" y2="12" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <line x1="7" y1="16" x2="9" y2="16" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <line x1="7" y1="20" x2="9" y2="20" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <!-- Pins (right) -->
  <line x1="23" y1="12" x2="25" y2="12" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <line x1="23" y1="16" x2="25" y2="16" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <line x1="23" y1="20" x2="25" y2="20" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
</svg>
