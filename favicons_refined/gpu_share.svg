<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <circle cx="5" cy="27" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="10" cy="27" r="1" fill="#38bdf8" opacity="0.6"/>
  <line x1="6.5" y1="27" x2="9" y2="27" stroke="#38bdf8" stroke-width="0.6" opacity="0.5"/>
  <circle cx="27" cy="5" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="22" cy="5" r="1" fill="#38bdf8" opacity="0.6"/>
  <line x1="23" y1="5" x2="25.5" y2="5" stroke="#38bdf8" stroke-width="0.6" opacity="0.5"/>
  <!-- GPU chip -->
  <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.3"/>
